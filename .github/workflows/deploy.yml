name: Deploy to Vercel

# Deploys the project (FastAPI backend + built Vite SPA) to Vercel production
# on every push to main. Requires repo secrets VERCEL_TOKEN, VERCEL_ORG_ID,
# VERCEL_PROJECT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to production
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Deployed to $url"
          echo "DEPLOY_URL=$url" >> "$GITHUB_OUTPUT"
        id: deploy

      - name: Smoke test
        run: |
          url="${{ steps.deploy.outputs.DEPLOY_URL }}"
          echo "Checking $url/api/health"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$url/api/health")
          echo "health -> $code"
          test "$code" = "200"
