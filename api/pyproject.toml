[project]
name = "case-closed-api"
version = "1.0.0"
description = "Case Closed: Earth System Trend Detective backend (NASA Space Apps 2026)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "httpx>=0.28.1",
    "numpy>=2.1.3",
    "pandas>=2.2.3",
    "pymannkendall>=1.4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["case_closed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
